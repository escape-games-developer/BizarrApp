<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 600" width="1440" height="600">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#001A22"/>
      <stop offset="50%" stop-color="#000D14"/>
      <stop offset="100%" stop-color="#06002A"/>
    </linearGradient>
    <radialGradient id="glowC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
