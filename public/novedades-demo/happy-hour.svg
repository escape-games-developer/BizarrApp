      <stop offset="100%" stop-color="#9B2FFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="11"/>
    </filter>
  </defs>

  <rect width="1440" height="600" fill="url(#bg2)"/>
  <ellipse cx="240"  cy="120" rx="430" ry="300" fill="url(#glowC)"/>
  <ellipse cx="1220" cy="500" rx="430" ry="300" fill="url(#glowD)"/>

  <!-- Burbujas -->
